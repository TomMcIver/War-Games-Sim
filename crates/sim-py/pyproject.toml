[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "warsim"
description = "War-Games-Sim: deterministic headless tactical sim as a vectorised RL environment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.23"]
dynamic = ["version"]

[tool.maturin]
module-name = "warsim"
# The workspace release profile uses panic = "abort", which would kill the
# Python interpreter on any sim-core panic. For the extension module we build
# with unwinding so panics are caught and re-raised as RuntimeError instead.
config = ['profile.release.panic="unwind"']
